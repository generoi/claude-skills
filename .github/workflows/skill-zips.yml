name: Skill zips

on:
  push:
    branches: [main]
    paths: ['plugins/**/skills/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each skill
        run: |
          mkdir -p dist
          for dir in plugins/*/skills/*/; do
            name=$(basename "$dir")
            (cd "$(dirname "$dir")" && zip -r "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
          done
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.zip --title "Latest skills" \
            --notes "Download a zip and upload it in claude.ai under Settings, then Skills."
